name: 200 MA Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy requests
      - run: python backtest/ma200_backtest.py
      - run: python backtest/ma200_cikis_testi.py
      - name: Sonucu kaydet
        run: |
          git config user.name "kripto-alarm-bot"
          git config user.email "kripto-alarm-bot@users.noreply.github.com"
          git add backtest/ma200_sonuc.csv backtest/ma200_islemler.csv
          git commit -m "200 MA backtest sonucu" || exit 0
          git push || (git pull --rebase && git push)
