name: Kripto Onay Alarmi

on:
  schedule:
    # Asıl tetikleyici cron-job.org (15 dakikada bir). Bu satır sadece yedek;
    # GitHub'ın kendi zamanlayıcısı saatlerce atlayabildiği için tek başına güvenilmez.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mod:
        description: "Ne yapılsın?"
        type: choice
        default: test
        options: [test, tara, ozet]

permissions:
  contents: write

concurrency:
  group: kripto-alarm
  cancel-in-progress: false

jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # her zaman en güncel durum.json ile başla (çift mesajı önler)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Paketleri kur
        run: pip install -r requirements.txt

      - name: Modu belirle
        id: mod
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mod=${{ inputs.mod }}" >> "$GITHUB_OUTPUT"
          else
            echo "mod=tara" >> "$GITHUB_OUTPUT"
          fi

      - name: Botu çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tarayici.py --mod "${{ steps.mod.outputs.mod }}"

      - name: Gönderilen sinyalleri kaydet
        run: |
          if ! git diff --quiet durum.json; then
            git config user.name "kripto-alarm-bot"
            git config user.email "kripto-alarm-bot@users.noreply.github.com"
            git add durum.json
            git commit -m "durum güncellendi"
            git push || (git pull --rebase && git push)
          fi
