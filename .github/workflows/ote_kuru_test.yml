name: OTE Kuru Test (gecici)

# Sadece ote-alarm dalına gönderimde çalışır. Telegram'a mesaj atmaz, hiçbir şeyi kaydetmez.
# Ana dala birleştirmeden önce silinecek.
on:
  push:
    branches: [ote-alarm]

jobs:
  kuru:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Yapay veri testi
        run: python testler/test_ote.py
      - name: Gercek veriyle kuru calistirma
        run: python testler/canli_kuru.py
      - name: Tarayicinin tamami (Telegram'siz)
        env:
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
        run: python tarayici.py --mod tara
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ote-grafikler
          path: |
            testler/_kuru/
            testler/_ornek_*.png
            _grafikler/
